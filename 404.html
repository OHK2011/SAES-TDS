<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>St. Andrew's TDS - Under Maintenance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      color: #eee;
      font-family: system-ui, sans-serif;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }
    .bg-lines {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: repeating-linear-gradient(
        115deg,
        rgba(200, 30, 45, 0.08) 0px,
        rgba(200, 30, 45, 0.08) 1px,
        transparent 1px,
        transparent 90px
      );
      background-size: 200% 200%;
      animation: driftLines 18s linear infinite;
    }
    @keyframes driftLines {
      0%   { background-position: 0% 0%; }
      100% { background-position: 100% 100%; }
    }
    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    img.logo {
      width: 140px;
      height: auto;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 1.5rem;
      max-width: 500px;
      line-height: 1.5;
      margin: 0;
    }
    footer {
      position: fixed;
      bottom: 16px;
      font-size: 0.8rem;
      color: #777;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="bg-lines"></div>
  <div class="content">
    <img class="logo" src="logo.png" alt="St. Andrew's Logo">
    <h1>St. Andrew's TDS is currently undergoing repair/updates.<br>Check back soon.</h1>
  </div>
  <footer>Designed By Echovant</footer>
</body>
</html>
